name: Build Android APK (Modern + Classic)
on:
  workflow_dispatch:
  push:
    branches: [main, daily-core]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Both UI Versions
        run: gradle --no-daemon :app:assembleModernDebug :app:assembleClassicDebug --stacktrace
      - name: Modern Tactical UI APK
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE-Automation-Modern-APK
          path: app/build/outputs/apk/modern/debug/app-modern-debug.apk
          if-no-files-found: error
      - name: Original Classic UI APK
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE-Automation-Classic-APK
          path: app/build/outputs/apk/classic/debug/app-classic-debug.apk
          if-no-files-found: error